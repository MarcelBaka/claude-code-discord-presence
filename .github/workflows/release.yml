name: release

# Push a tag like v1.2.3 → tests run, then a GitHub Release is published with
# the macOS and Windows downloads built by tools/build-release.js.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/unit.test.js test/integration.test.js

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches app/version.json
        run: |
          v=$(node -p "require('./app/version.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/version.json ($v). Bump app/version.json first."
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        # fails when CHANGELOG.md has no section for this version
        run: node tools/release-notes.js "$GITHUB_REF_NAME" release-notes.md
      - name: Build downloads
        run: node tools/build-release.js "$GITHUB_REF_NAME" dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # notes = CHANGELOG section + download instructions, then GitHub's list of merged PRs
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag
